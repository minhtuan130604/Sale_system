<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f2f2f2;
        }

        .login-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }

        h2 {
            color: #007bff;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .error-message {
            color: red;
            margin-bottom: 10px;
        }

        .register-link {
            margin-top: 10px;
            color: #007bff;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Đăng nhập</h2>

    <!-- Hiển thị thông báo lỗi nếu có -->
    <div th:if="${param.error}">
        <p class="error-message">Tài khoản hoặc mật khẩu không đúng!</p>
    </div>


    <form th:action="@{/auth/login}" method="post">
    <input type="text" name="username" placeholder="Tên đăng nhập" required/>
        <input type="password" name="password" placeholder="Mật khẩu" required/>
        <button type="submit">Đăng nhập</button>
    </form>

    <p class="register-link">Chưa có tài khoản? <a th:href="@{/auth/register}">Đăng ký ngay</a></p>
</div>

</body>
</html>
