<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đơn hàng của bạn</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        .orders-container {
            max-width: 900px;
            margin: 50px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .order-status {
            font-weight: bold;
            color: #007bff;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

    </style>
</head>
<body>

<div class="orders-container">
    <h2>📦 Lịch sử đơn hàng</h2>
    <table>
        <tr>
            <th>Mã đơn hàng</th>
            <th>Sản phẩm</th>
            <th>Giá</th>
            <th>Ngày đặt</th>
            <th>Trạng thái</th>
            <th>Chi tiết</th>
        </tr>
        <tr th:each="order : ${orderHistory}">
            <td th:text="${order.id}"></td>
            <td th:text="${order.productName}"></td>
            <td th:text="${order.price} + ' VNĐ'"></td>
            <td th:text="${order.orderDate}"></td>
            <td class="order-status" th:text="${order.status}"></td>
            <td class="actions">
                <button th:onclick="'window.location.href=\'/orders/' + ${order.id} + '\''">Xem chi tiết</button>
            </td>
        </tr>
    </table>
</div>

</body>
</html>
