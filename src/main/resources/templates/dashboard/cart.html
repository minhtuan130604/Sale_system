<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Giỏ hàng của bạn</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f8f9fa;
        margin: 0;
        padding: 0;
    }

    .cart-container {
        max-width: 800px;
        margin: 50px auto;
        background-color: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 2px 10px rgba(0,0,0,0.1);
        text-align: center;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
    }

    input[type="number"] {
        width: 50px;
    }

    .cart-total {
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
    }

    button {
        padding: 10px 15px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #0056b3;
    }
  </style>
</head>
<body>

<div class="cart-container">
  <h2>🛒 Giỏ hàng của bạn</h2>
  <table>
    <tr>
      <th>Sản phẩm</th>
      <th>Giá</th>
      <th>Số lượng</th>
      <th>Thành tiền</th>
      <th>Hành động</th>
    </tr>
    <tr th:each="item : ${cartItems}">
      <td th:text="${item.name}"></td>
      <td th:text="${item.price}"></td>
      <td><input type="number" th:value="${item.quantity}" min="1"></td>
      <td th:text="${item.price * item.quantity}"></td>
      <td><button>Xóa</button></td>
    </tr>
  </table>

  <div class="cart-total">
    Tổng: <span th:text="${totalPrice}"></span> VNĐ
  </div>

  <button>Thanh toán</button>
</div>

</body>
</html>
